<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Be Your Own Damn Boss</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Give Us Your Feedback</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="chapters.html">Chapters</a>
            <a href="progress.html">My Progress</a>
            <a href="feedback.html">Feedback</a>
        </nav>
    </header>
    <main>
        <h2>We Value Your Feedback!</h2>
        <form id="feedback-form">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="rating">Overall Rating (1-5):</label>
                <select id="rating" name="rating" required>
                    <option value="">--Select a rating--</option>
                    <option value="5">5 - Excellent</option>
                    <option value="4">4 - Very Good</option>
                    <option value="3">3 - Good</option>
                    <option value="2">2 - Fair</option>
                    <option value="1">1 - Poor</option>
                </select>
            </div>
            <div>
                <label for="comments">Comments:</label>
                <textarea id="comments" name="comments" rows="5" required></textarea>
            </div>
            <button type="submit">Submit Feedback</button>
        </form>
        <p id="feedback-confirmation" class="hidden">Thank you for your feedback!</p>
    </main>
    <footer>
        <p>&copy; 2024 Be Your Own Damn Boss</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
