<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Be Your Own Damn Boss</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Submit Your Feedback</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="chapters.html">Chapters</a>
            <a href="progress.html">My Progress</a>
            <a href="feedback.html">Feedback</a>
        </nav>
    </header>
    <main>
        <h2>We Value Your Feedback!</h2>
        <p>We'd love to hear your thoughts, suggestions, or any questions you might have!</p>
        <form id="feedback-form">
            <div>
                <label for="feedback-name">Name (Optional):</label>
                <input type="text" id="feedback-name" name="name">
            </div>
            <div>
                <label for="feedback-email">Email (Optional, if you'd like a response):</label>
                <input type="email" id="feedback-email" name="email">
            </div>
            <div>
                <label for="feedback-message">Message:</label>
                <textarea id="feedback-message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit">Submit Feedback</button>
        </form>
        <p id="feedback-confirmation" class="hidden">Thank you! Your email client should open shortly for you to send your feedback.</p>
    </main>
    <footer>
        <p>&copy; 2024 Be Your Own Damn Boss</p>
    </footer>
    <script src="script.js" defer></script>
</body>
</html>
